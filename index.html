<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>F1 Hand Drive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', sans-serif; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #fff; z-index: 10;
    text-shadow: 0 1px 4px #000; user-select: none;
  }
  #speed { font-size: 44px; font-weight: 700; font-style: italic; }
  #speed span { font-size: 18px; font-weight: 400; }
  #gesture { font-size: 14px; opacity: 0.85; margin-top: 4px; }
  #wheel {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 10px; background: rgba(255,255,255,0.15);
    border-radius: 5px; z-index: 10;
  }
  #wheelKnob {
    position: absolute; top: -5px; left: 50%; width: 20px; height: 20px;
    background: #e10600; border-radius: 50%; transform: translateX(-50%);
    transition: left 0.05s linear;
  }
  #cam {
    position: fixed; bottom: 16px; right: 16px; width: 240px; height: 180px;
    border-radius: 8px; border: 2px solid rgba(255,255,255,0.3); z-index: 10;
    transform: scaleX(-1); object-fit: cover; background: #000;
  }
  #overlay {
    position: fixed; bottom: 16px; right: 16px; width: 240px; height: 180px;
    z-index: 11; transform: scaleX(-1); pointer-events: none;
  }
  #status {
    position: fixed; top: 16px; right: 16px; color: #fff; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; z-index: 10;
    max-width: 280px;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 8; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.85) 100%);
  }
  #help {
    position: fixed; bottom: 60px; left: 16px; color: rgba(255,255,255,0.7);
    font-size: 12px; z-index: 10; line-height: 1.6;
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div id="speed">0 <span>km/h</span></div>
  <div id="gesture">키보드 모드 (카메라 로딩 중...)</div>
</div>
<div id="status">카메라 권한을 허용하면 손동작 운전 시작</div>
<div id="help">
  🙂 머리 기울기 = 핸들 (얼굴 미감지 시 손 각도)<br>
  ✊ 주먹 = 가속 / 🖐️ 펼침 = 브레이크 (한 손)<br>
  키보드: ↑/W 가속, ↓/S 브레이크, ←→/AD 조향, C 시점 전환
</div>
<div id="wheel"><div id="wheelKnob"></div></div>
<div id="vignette"></div>
<video id="cam" autoplay playsinline muted></video>
<canvas id="overlay" width="240" height="180"></canvas>

<script type="module">
import * as THREE from 'three';

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a18);
scene.fog = new THREE.Fog(0x0a0a18, 80, 320);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x223322, 0.7));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.2);
sun.position.set(60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshLambertMaterial({ color: 0x1c4022 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Ring track: inner radius 70, outer 100
const TRACK_MID = 85, TRACK_HALF = 15;
const track = new THREE.Mesh(
  new THREE.RingGeometry(TRACK_MID - TRACK_HALF, TRACK_MID + TRACK_HALF, 96),
  new THREE.MeshLambertMaterial({ color: 0x33353a })
);
track.rotation.x = -Math.PI / 2;
track.position.y = 0.01;
track.receiveShadow = true;
scene.add(track);

// Center line (dashed ring of small plates)
for (let i = 0; i < 72; i++) {
  const a = (i / 72) * Math.PI * 2;
  const dash = new THREE.Mesh(
    new THREE.PlaneGeometry(0.4, 3),
    new THREE.MeshBasicMaterial({ color: 0xdddddd })
  );
  dash.rotation.x = -Math.PI / 2;
  dash.rotation.z = -a;
  dash.position.set(Math.cos(a) * TRACK_MID, 0.02, Math.sin(a) * TRACK_MID);
  scene.add(dash);
}

// Red/white kerb blocks on both edges
function addKerbs(radius) {
  for (let i = 0; i < 120; i++) {
    const a = (i / 120) * Math.PI * 2;
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.5, 3.5),
      new THREE.MeshLambertMaterial({ color: i % 2 ? 0xe10600 : 0xffffff })
    );
    block.position.set(Math.cos(a) * radius, 0.25, Math.sin(a) * radius);
    block.rotation.y = -a + Math.PI / 2;
    block.castShadow = true;
    scene.add(block);
  }
}
addKerbs(TRACK_MID - TRACK_HALF - 1);
addKerbs(TRACK_MID + TRACK_HALF + 1);

// Start/finish line
const startLine = new THREE.Mesh(
  new THREE.PlaneGeometry(TRACK_HALF * 2, 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
startLine.rotation.x = -Math.PI / 2;
startLine.position.set(TRACK_MID, 0.02, 0);
scene.add(startLine);

// ---------- F1 car (box-built) ----------
function buildCar() {
  const car = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xe10600 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x18181c });

  const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.45, 3.6), red);
  body.position.y = 0.45;
  car.add(body);

  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 1.2), red);
  nose.position.set(0, 0.4, 2.2);
  car.add(nose);

  const frontWing = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 0.5), dark);
  frontWing.position.set(0, 0.25, 2.7);
  car.add(frontWing);

  const rearWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.45), dark);
  rearWing.position.set(0, 1.0, -1.85);
  car.add(rearWing);
  const wingPost = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.3), dark);
  wingPost.position.set(0, 0.75, -1.8);
  car.add(wingPost);

  const cockpit = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.35, 1.0), dark);
  cockpit.position.set(0, 0.75, -0.2);
  car.add(cockpit);

  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.05, 8, 16, Math.PI), dark);
  halo.position.set(0, 0.95, -0.2);
  car.add(halo);

  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.4, 18);
  const wheels = [];
  for (const [x, z] of [[-0.85, 1.4], [0.85, 1.4], [-0.85, -1.3], [0.85, -1.3]]) {
    const w = new THREE.Mesh(wheelGeo, dark);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, 0.42, z);
    car.add(w);
    wheels.push(w);
  }
  // steering wheel (visible in cockpit view)
  const sw = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.028, 8, 20), dark);
  sw.add(rim);
  for (const a of [0, Math.PI / 2]) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.035, 0.03), dark);
    spoke.rotation.z = a;
    sw.add(spoke);
  }
  const hub = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.04), red);
  sw.add(hub);
  sw.position.set(0, 0.88, 0.35);
  sw.rotation.x = -0.45;
  car.add(sw);

  car.traverse(o => { if (o.isMesh) o.castShadow = true; });
  car.userData.wheels = wheels;
  car.userData.steerWheel = sw;
  return car;
}
const car = buildCar();
car.position.set(TRACK_MID, 0, 0);
car.rotation.y = Math.PI;  // facing -z (counter-clockwise around ring)
scene.add(car);

// ---------- Input state ----------
const keys = {};
let cockpitView = true;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyC') cockpitView = !cockpitView;
});
addEventListener('keyup', e => keys[e.code] = false);

let handSteer = null;     // -1..1 or null when hands not tracked
let handThrottle = null;  // 1 accel, -1 brake, 0 coast, null no hands

// ---------- Physics ----------
const MAX_SPEED = 75;        // m/s (~270 km/h)
const ACCEL = 22, BRAKE = 45, DRAG = 4.5;
let speed = 0, heading = Math.PI;

const speedEl = document.getElementById('speed');
const gestureEl = document.getElementById('gesture');
const knobEl = document.getElementById('wheelKnob');
const statusEl = document.getElementById('status');
const vigEl = document.getElementById('vignette');

let smoothSteer = 0;
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- resolve input: hands take priority when tracked ---
  let steer = 0, throttle = 0;
  if (handSteer !== null) {
    steer = handSteer;
    throttle = handThrottle ?? 0;
  } else {
    if (keys.ArrowLeft || keys.KeyA) steer = -1;
    if (keys.ArrowRight || keys.KeyD) steer = 1;
    if (keys.ArrowUp || keys.KeyW) throttle = 1;
    if (keys.ArrowDown || keys.KeyS) throttle = -1;
  }
  smoothSteer += (steer - smoothSteer) * Math.min(1, dt * 10);

  // --- speed ---
  if (throttle > 0) speed += ACCEL * throttle * dt;
  else if (throttle < 0) speed += BRAKE * throttle * dt;
  speed -= DRAG * dt * (speed / MAX_SPEED + 0.15);
  speed = Math.max(0, Math.min(MAX_SPEED, speed));

  // --- heading: steering effect scales with speed, capped ---
  const steerEffect = 1.6 * Math.min(1, speed / 12);
  heading -= smoothSteer * steerEffect * dt * (speed > 0.5 ? 1 : 0);

  car.position.x += Math.sin(heading) * speed * dt;
  car.position.z += Math.cos(heading) * speed * dt;
  car.rotation.y = heading;

  // grass slowdown outside track
  const r = Math.hypot(car.position.x, car.position.z);
  const offTrack = r < TRACK_MID - TRACK_HALF || r > TRACK_MID + TRACK_HALF;
  if (offTrack) speed *= Math.max(0, 1 - 1.5 * dt);

  // wheel spin
  for (const w of car.userData.wheels) w.rotation.x += speed * dt / 0.42;
  // steering wheel turns with input
  car.userData.steerWheel.rotation.z = -smoothSteer * 2.2;

  // camera
  const fwdX = Math.sin(heading), fwdZ = Math.cos(heading);
  if (cockpitView) {
    // driver eye + speed shake (stronger on grass)
    const shakeAmp = (speed / MAX_SPEED) * 0.05 + (offTrack && speed > 2 ? 0.07 : 0);
    const sx = (Math.random() * 2 - 1) * shakeAmp;
    const sy = (Math.random() * 2 - 1) * shakeAmp;
    camera.position.set(
      car.position.x - fwdX * 0.15 + Math.cos(heading) * sx,
      1.35 + sy,
      car.position.z - fwdZ * 0.15 - Math.sin(heading) * sx
    );
    camera.lookAt(
      car.position.x + fwdX * 30,
      0.75 + sy * 8,
      car.position.z + fwdZ * 30
    );
    const targetFov = 72 + (speed / MAX_SPEED) * 23;   // speed rush
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 5);
    camera.updateProjectionMatrix();
  } else {
    const camDist = 9 + speed * 0.06;
    const target = new THREE.Vector3(
      car.position.x - fwdX * camDist,
      4 + speed * 0.02,
      car.position.z - fwdZ * camDist
    );
    camera.position.lerp(target, Math.min(1, dt * 4));
    camera.lookAt(car.position.x, 1.2, car.position.z);
    camera.fov += (70 - camera.fov) * Math.min(1, dt * 5);
    camera.updateProjectionMatrix();
  }

  // HUD
  speedEl.firstChild.textContent = Math.round(speed * 3.6) + ' ';
  knobEl.style.left = (50 + smoothSteer * 45) + '%';
  vigEl.style.opacity = Math.min(0.85, speed / MAX_SPEED * 0.9 + (offTrack && speed > 2 ? 0.15 : 0));

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- MediaPipe hands ----------
const video = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');

function camErrorMessage(err) {
  if (!isSecureContext) return '보안 컨텍스트 아님 — http://localhost:8741 로 열어야 함 (file:// 또는 IP 접속은 카메라 불가)';
  switch (err.name) {
    case 'NotAllowedError':
      return '카메라 권한 차단됨 — 주소창 오른쪽 카메라 아이콘 클릭 → 허용 → 재시도. (Windows 설정 > 개인정보 > 카메라 허용도 확인)';
    case 'NotFoundError':
      return '카메라 장치를 찾을 수 없음 — 웹캠 연결 확인';
    case 'NotReadableError':
      return '카메라가 다른 앱에서 사용 중 — Zoom/Discord/카메라 앱 종료 후 재시도';
    default:
      return '카메라 오류 (' + err.name + ': ' + err.message + ')';
  }
}

async function initHands() {
  let landmarker, faceLandmarker;
  try {
    statusEl.textContent = '손/얼굴 추적 모델 로딩 중...';
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const { FilesetResolver, HandLandmarker, FaceLandmarker } = vision;
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      numHands: 1,
      runningMode: 'VIDEO'
    });
    faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      numFaces: 1,
      runningMode: 'VIDEO'
    });
  } catch (err) {
    showRetry('모델 로드 실패 (네트워크 확인): ' + err.message);
    return;
  }

  try {
    statusEl.textContent = '카메라 권한 요청 중... (허용을 눌러주세요)';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 }, audio: false
    });
    video.srcObject = stream;
    await new Promise(res => video.onloadedmetadata = res);
    statusEl.textContent = '추적 활성. 한 손 + 얼굴을 카메라에 보여주세요.';
  } catch (err) {
    showRetry(camErrorMessage(err));
    return;
  }

  let lastT = -1;
  function detect() {
    requestAnimationFrame(detect);
    if (video.currentTime === lastT) return;
    lastT = video.currentTime;
    const now = performance.now();
    const handResult = landmarker.detectForVideo(video, now);
    const faceResult = faceLandmarker.detectForVideo(video, now);
    processInput(handResult, faceResult);
  }
  detect();
}

function showRetry(msg) {
  statusEl.textContent = msg + ' ';
  gestureEl.textContent = '키보드 모드';
  const btn = document.createElement('button');
  btn.textContent = '🔄 재시도';
  btn.style.cssText = 'margin-top:6px;display:block;cursor:pointer;';
  btn.onclick = () => { statusEl.textContent = ''; initHands(); };
  statusEl.appendChild(btn);
}

// openness: avg fingertip-to-wrist distance, normalized by palm size
function openness(lm) {
  const wrist = lm[0], middleBase = lm[9];
  const palm = Math.hypot(middleBase.x - wrist.x, middleBase.y - wrist.y);
  let sum = 0;
  for (const i of [8, 12, 16, 20]) {
    sum += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y);
  }
  return (sum / 4) / palm;  // open ~1.8+, fist ~0.9
}

function processInput(handResult, faceResult) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  const hands = handResult.landmarks || [];
  const faces = faceResult.faceLandmarks || [];

  // draw hand landmarks
  octx.fillStyle = '#00ff88';
  for (const lm of hands) {
    for (const p of lm) {
      octx.beginPath();
      octx.arc(p.x * overlay.width, p.y * overlay.height, 2.5, 0, Math.PI * 2);
      octx.fill();
    }
  }

  if (hands.length === 0) {
    handSteer = null; handThrottle = null;
    gestureEl.textContent = '손 미감지 → 키보드 모드';
    return;
  }

  const hand = hands[0];

  // --- throttle: fist = accelerate, open = brake ---
  const o = openness(hand);
  const OPEN = 1.5, FIST = 1.15;
  if (o < FIST) handThrottle = 1;
  else if (o > OPEN) handThrottle = -1;
  else handThrottle = 0;

  // --- steering: head roll (eye line); fallback = hand tilt ---
  let steer = 0, src;
  if (faces.length > 0) {
    const f = faces[0];
    // outer eye corners; sort by raw x so dx > 0
    const [e1, e2] = [f[33], f[263]].sort((a, b) => a.x - b.x);
    const angle = Math.atan2(e2.y - e1.y, e2.x - e1.x);
    steer = -angle / (Math.PI / 7.2);            // ±25° head tilt → ±1
    src = '🙂 머리';
    // draw eye line
    octx.strokeStyle = '#ffcc00';
    octx.lineWidth = 2;
    octx.beginPath();
    octx.moveTo(e1.x * overlay.width, e1.y * overlay.height);
    octx.lineTo(e2.x * overlay.width, e2.y * overlay.height);
    octx.stroke();
  } else {
    // hand tilt: wrist(0) -> middle MCP(9) direction vs vertical
    const wrist = hand[0], mcp = hand[9];
    const angle = Math.atan2(mcp.x - wrist.x, -(mcp.y - wrist.y));
    steer = -angle / (Math.PI / 6);              // ±30° hand tilt → ±1
    src = '✋ 손각도';
  }
  steer = Math.max(-1, Math.min(1, steer));
  handSteer = Math.abs(steer) < 0.1 ? 0 : steer;  // dead zone

  const tIcon = handThrottle > 0 ? '✊ 가속' : handThrottle < 0 ? '🖐️ 브레이크' : '— 관성';
  gestureEl.textContent = `${src} 핸들 ${(steer * 100).toFixed(0)}% | ${tIcon}`;
}

initHands();
</script>
</body>
</html>
